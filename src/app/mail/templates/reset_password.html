<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6fa;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            margin: 0 auto;
        }
        h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .message {
            color: #334155;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .code-box {
            background-color: #f1f5f9;
            border-radius: 16px;
            padding: 16px;
            margin: 20px 0;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .code {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #0f172a;
            font-family: monospace;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 24px;
        }
        .footer p {
            margin-top: 8px;
        }
        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }
            .code {
                font-size: 28px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{title}}</h2>
        <div class="message">{{message}}</div>
        <div class="code-box">
            <span class="code">{{code}}</span>
        </div>
        <p style="font-size: 14px; color: #475569;">Insira este código no aplicativo para redefinir sua senha.</p>
        <div class="footer">
            <p>Se você não solicitou esta redefinição, ignore este e‑mail.</p>
            <p>Este código expira em 15 minutos.</p>
        </div>
    </div>
</body>
</html>
